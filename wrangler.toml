name = "latte-finance-worker"
account_id = "c9cb13e9ce172aecf02828557cd72f20"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "api.lattefinance.app", custom_domain = true }]

[vars]
# Public Google OAuth client ids, comma separated. Empty until the Google client exists:
# /google-signup and /google-login then answer 409 google_not_configured.
GOOGLE_CLIENT_IDS = ""
# "resend" in production. Local `wrangler dev` sets EMAIL_MODE=log in .dev.vars (nothing is sent).
EMAIL_MODE = "resend"
MAIL_FROM = "Latte Finance <hello@lattefinance.app>"
# Production web build. Local `wrangler dev` overrides it in .dev.vars (git-ignored).
APP_URL = "https://mobile.lattefinance.app"

# `wrangler dev` and the tests use a local D1 copy. The remote database gets
# the migrations only through `d1 migrations apply --remote`, run with the
# scoped HOME described in CLAUDE.md. Never add `remote = true` here.
[[d1_databases]]
binding = "DB"
database_name = "latte-finance-db"
database_id = "ef71aaf7-4237-40ad-9158-7189639d38e0"
migrations_dir = "migrations"

# Rate limits (Cloudflare rate limiting). Keys are built in the routes.
[[ratelimits]]
name = "RL_1"
namespace_id = "1001"
simple = { limit = 1, period = 60 }

[[ratelimits]]
name = "RL_5"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_20"
namespace_id = "1020"
simple = { limit = 20, period = 60 }
